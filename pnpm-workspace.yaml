packages:
  - packages/*
  - examples/*

allowBuilds:
  esbuild: false
  sharp: false

versioning:
  fixed:
    - - "@better-css-modules/core"
      - "@better-css-modules/cli"
      - "@better-css-modules/unplugin"
      - "@better-css-modules/vite"
      - "@better-css-modules/webpack"
      - "@better-css-modules/rollup"
      - "@better-css-modules/rspack"
      - "@better-css-modules/esbuild"
      - "@better-css-modules/turbopack"
  changelog:
    storage: repository

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/vite-plus-*"
  # vite-plus pins its toolchain to exact versions, so installing a fresh
  # vite-plus release also needs the oxlint-tsgolint it was built against
  - oxlint-tsgolint@7.0.2003
  - "@oxlint-tsgolint/*"
